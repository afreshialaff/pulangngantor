name: Pulang ngantor — upload ke YouTube

on:
  workflow_dispatch:
    inputs:
      tanggal:
        description: "folder data/produksi/<tanggal> (YYYY-MM-DD)"
        required: true
      video_path:
        description: "path video di repo (mis. data/produksi/2026-11-20/video.mp4)"
        required: true
      privacy:
        description: "private | unlisted | public"
        default: "private"

permissions:
  contents: write

concurrency:
  group: upload-${{ github.event.inputs.tanggal }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      D: data/produksi/${{ github.event.inputs.tanggal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXPECTED_CHANNEL_ID: ${{ secrets.YT_EXPECTED_CHANNEL_ID }}
        run: |
          test -f "$D/upload.json" && { echo "upload.json sudah ada, tidak diunggah ulang"; exit 0; }
          THUMB=""; [ -f "$D/thumbnail.jpg" ] && THUMB="--thumb $D/thumbnail.jpg"
          CAP=""; [ -f "$D/subtitle.srt" ] && CAP="--captions $D/subtitle.srt"
          python tools/upload.py --video "${{ github.event.inputs.video_path }}" --meta "$D/metadata.json" \
            $THUMB $CAP --privacy "${{ github.event.inputs.privacy }}" --result "$D/upload.json"
      - name: Catat hasil ke repo
        if: always()
        run: |
          git config user.name "pulangngantor-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "upload ${{ github.event.inputs.tanggal }}" && git push; }
