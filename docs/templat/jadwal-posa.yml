# Jam tayang mengikuti config.yaml schedule.publish_hour (WIB); ganti <JAM> (dua digit) dan sesuaikan cron: UTC = WIB - 7 jam; cron utama 35 dan 15 menit sebelum jam tayang, cadangan +15 dan +60 menit.
# Salin ke .github/workflows/jadwal-posa-<topik>.yml. Ganti <TANGGAL_TAYANG> (YYYY-MM-DD), <TGL> (folder data/produksi),
# <TOPIK>, dan baris cron (UTC = WIB - 7 jam; contoh tayang 20.00 WIB -> 13.00 UTC: 19.25 WIB = "25 12", 19.45 = "45 12", 20.15 = "15 13", 21.00 = "0 14").
name: Jadwal sekali jalan POSA - <TOPIK> <JAM>.00 WIB
on:
  schedule:
    - cron: "25 12 <HARI> <BULAN> *"
    - cron: "45 12 <HARI> <BULAN> *"
    - cron: "15 13 <HARI> <BULAN> *"   # cadangan 20.15 WIB
    - cron: "0 14 <HARI> <BULAN> *"    # cadangan 21.00 WIB
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: jadwal-posa-<TOPIK>, cancel-in-progress: false }
jobs:
  jadwal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TGL: <TGL>
    steps:
      - uses: actions/checkout@v4
      - name: Tunggu jam tayang lalu picu upload
        run: |
          D=data/produksi/$TGL
          [ -f "$D/.dijadwalkan" ] && { echo "sudah dijalankan, berhenti"; exit 0; }
          # Gerbang: review.json harus ada dan tidak berstatus gagal (QC selesai sebelum jadwal dibuat)
          python3 -c "import json,sys;r=json.load(open('$D/review.json'));sys.exit(1 if r.get('status')=='gagal' else 0)" \
            || { echo "review.json tidak ada atau gagal, jadwal dibatalkan"; exit 1; }
          target=$(date -d "<TANGGAL_TAYANG> <JAM>:00:00 +0700" +%s)
          now=$(date +%s)
          [ $((target-now)) -gt 3000 ] && { echo "terlalu awal (>50 menit sebelum jam tayang), berhenti"; exit 0; }
          [ "$now" -lt "$target" ] && { echo "tunggu $((target-now)) detik"; sleep $((target-now)); }
          git pull --rebase -q origin main
          python3 - <<'PY'
          import json,os
          f="data/produksi/"+os.environ["TGL"]+"/review.json"
          r=json.load(open(f)); r["status"]="lolos"
          json.dump(r,open(f,"w"),ensure_ascii=False,indent=1)
          PY
          date -u +%FT%TZ > "$D/.dijadwalkan"
          git config user.name "posa-bot"; git config user.email "actions@users.noreply.github.com"
          git add "$D" && git commit -m "review: setujui $TGL untuk tayang"
          git pull --rebase -q origin main && git push origin HEAD:main
          # Video yang sudah diunggah (upload.json ada) tidak diunggah ulang: cukup ubah privasinya
          TAHAP=upload; [ -f "$D/upload.json" ] && TAHAP=publish
          gh workflow run produksi-posa.yml -f tanggal="$TGL" -f tahap="$TAHAP" -f privacy=public
