name: Pulang ngantor — ganti thumbnail

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "folder data/produksi/<folder> yang punya upload.json"
        required: true

permissions:
  contents: write

jobs:
  thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D: data/produksi/${{ github.event.inputs.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ganti thumbnail
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXPECTED_CHANNEL_ID: ${{ secrets.YT_EXPECTED_CHANNEL_ID }}
        run: python tools/ganti_thumbnail.py "$D"
      - name: Catat hasil
        run: |
          git config user.name "pulangngantor-bot"; git config user.email "actions@users.noreply.github.com"
          git add "$D/upload.json"
          git diff --cached --quiet || { git commit -m "ganti thumbnail ${{ github.event.inputs.folder }}" && git push; }
